name: Build and push

on:
  push:
    branches: [my-fork]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: '*.tgz'
          if-no-files-found: error

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Unpack
        run: |
          shopt -s nullglob
          for f in *.tgz; do
            if [[ $f =~ ^(.*)-[0-9].*\.tgz$ ]]; then
              dir="${BASH_REMATCH[1]}"
              mkdir -p "$dir"
              tar --strip-components=1 -xzf "$f" -C "$dir"
            fi
          done

      - name: Push @myrtus/koishi-plugin-forward
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: myrtus-koishi-plugin-forward
          build_dir: myrtus-koishi-plugin-forward
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
